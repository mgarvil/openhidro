name: app-windows
# Gera o instalador do aplicativo para Windows a cada push em main que mexa em app/ e o publica
# na aba Releases como "app-vX.Y.Z" (versão lida de app/src-tauri/tauri.conf.json).
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: npm ci
        working-directory: app
      - name: Compilar e publicar instalador
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: app-v__VERSION__
          releaseName: "OpenHidro app v__VERSION__"
          releaseBody: |
            Instalador do OpenHidro para Windows.
            Baixe **OpenHidro_…_x64-setup.exe** (recomendado — instala só para o seu usuário, sem administrador) e execute.
            O Windows pode avisar que o editor não é verificado: clique em "Mais informações" → "Executar assim mesmo".
          releaseDraft: false
          prerelease: true
          uploadWorkflowArtifacts: true
