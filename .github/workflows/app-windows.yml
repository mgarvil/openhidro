name: app-windows
# Gera o instalador do aplicativo para Windows.
# - a cada push em main que mexa em app/: compila e guarda o instalador como artefato
# - ao criar uma tag app-vX.Y.Z: publica uma versão (Release) com o instalador para download
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-windows.yml"]
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: npm ci
      - name: Compilar instalador
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: OpenHidro-instalador-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
      - name: Publicar versão
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "OpenHidro ${{ github.ref_name }}"
          releaseBody: "Instalador do OpenHidro para Windows. Baixe o arquivo OpenHidro_..._x64-setup.exe e execute."
          releaseDraft: false
          prerelease: true
