[package]
name = "openhidro"
version = "0.7.0"
description = "OpenHidro — projeto hidrossanitário"
authors = ["Marcelo Pacifico Garvil"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "openhidro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
getrandom = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
